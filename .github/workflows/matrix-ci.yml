name: Day 3 Advanced CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/requirements.txt

      - name: Check cache
        run: |
          echo "Cache hit: ${{ steps.setup-python.outputs.cache-hit }}"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          pip install -r apps/requirements.txt

      - name: Run tests and generate test report
        run: |
          python -m pytest --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-result-${{ matrix.python-version }}.xml
